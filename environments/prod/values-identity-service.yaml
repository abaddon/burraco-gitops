name: identity-service
image:
  repository: ghcr.io/abaddon/ai-burraco-identity-service
  tag: 14363c8282bcb204d7f30cd8432ba574c35cf110
service:
  port: 8091
database:
  serviceDb: burraco_identity
ingress:
  pathPrefixes:
    - /api/v1/identity
    - /api/v1/auth
envFromSecrets:
  - postgres-credentials
  - redis-password
  - jwt-keys
  - brevo-api-key
env:
  SPRING_PROFILES_ACTIVE: prod
  BREVO_SENDER_EMAIL: noreply@burraco.qwertyha.co.uk
  BREVO_SENDER_NAME: "AI Burraco"
  APP_BASE_URL: https://burraco.qwertyha.co.uk
