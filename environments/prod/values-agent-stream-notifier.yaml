name: agent-stream-notifier
image:
  repository: ghcr.io/abaddon/agent-stream-notifier
  tag: 0a4d74815948b09671c1129e514dbed2965cba81 # bumped by CI
  pullSecrets:
    - ghcr-pull
service:
  port: 8787
envFromSecrets:
  - agent-stream-notifier-credentials
env:
  KAFKA_BROKERS: redpanda.infra.svc.cluster.local:9092
ingress:
  pathPrefixes:
    - /events
    - /health
# In-memory service, low traffic — minimal resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
