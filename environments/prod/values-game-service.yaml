name: game-service
image:
  repository: ghcr.io/abaddon/ai-burraco-game-service
  tag: 79e210e66f08c98e6250603be52f5f9e282d7822
service:
  port: 8085
database:
  serviceDb: burraco_game
ingress:
  pathPrefixes:
    - /api/v1/game
  websocketPaths:
    - /ws/game
