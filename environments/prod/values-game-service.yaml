name: game-service
image:
  repository: ghcr.io/abaddon/ai-burraco-game-service
  tag: 06552685d7e740407e5e451e16c8d8b403a02ca0
service:
  port: 8085
database:
  serviceDb: burraco_game
ingress:
  pathPrefixes:
    - /api/v1/game
  websocketPaths:
    - /ws/game
# game-service è l'event-sourced aggregate; serve un po' più di memoria per snapshot/replay
resources:
  requests:
    cpu: 150m
    memory: 640Mi
  limits:
    cpu: 1500m
    memory: 768Mi
