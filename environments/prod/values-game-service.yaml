name: game-service
image:
  repository: ghcr.io/abaddon/ai-burraco-game-service
  tag: f5f59ba54d2bc9fb0b70fc76c00b764cdc6e82b3
service:
  port: 8085
database:
  serviceDb: burraco_game
ingress:
  pathPrefixes:
    - /api/v1/game
  websocketPaths:
    - /ws/game
# game-service è l'event-sourced aggregate; serve un po' più di memoria per snapshot/replay
resources:
  requests:
    cpu: 150m
    memory: 640Mi
  limits:
    cpu: 1500m
    memory: 768Mi
