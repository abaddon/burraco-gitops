name: game-service
image:
  repository: ghcr.io/abaddon/ai-burraco-game-service
  tag: 9c8fec6e0821c846cb2ea2dc5963e103ebeda555
service:
  port: 8085
database:
  serviceDb: burraco_game
ingress:
  pathPrefixes:
    - /api/v1/game
  websocketPaths:
    - /ws/game
