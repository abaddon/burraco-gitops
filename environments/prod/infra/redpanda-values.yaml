# Single-broker Redpanda — niente TLS/SASL (cluster privato, accesso solo intra-cluster)
statefulset:
  replicas: 1

resources:
  # 2026-05-29: bumped 1 → 2 cores. Redpanda's Seastar architecture runs
  # one reactor per core; with a single core, all I/O completions,
  # replication, and background tasks queue on shard 0, and any
  # blocking-ish work (ext4 journal commits on segment fsync, segment
  # lifecycle on local-path PV, schema-registry restarts) shows up as
  # "Reactor stalled for N ms on shard 0" log spam — 235 stalls per
  # 2000 log lines (~14%) with durations 103–513 ms. Node has plenty
  # of headroom (3.3/6 cores currently requested cluster-wide).
  # Redpanda's own docs recommend ≥ 2 cores for production.
  cpu:
    cores: 2
  memory:
    container:
      max: 1536Mi
  redpanda:
    memory: 1G
    reserveMemory: 0M
    overprovisioned: true

storage:
  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 10Gi

tls:
  enabled: false

auth:
  sasl:
    enabled: false

listeners:
  kafka:
    port: 9092
  schemaRegistry:
    port: 8081

# Niente external listener — l'accesso è solo intra-cluster
external:
  enabled: false

# Redpanda Console gestita inline dal chart
console:
  enabled: true
  ingress:
    enabled: false   # esposto solo via Tailscale o port-forward
  console:
    config:
      kafka:
        brokers: ["redpanda.infra.svc.cluster.local:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda.infra.svc.cluster.local:8081"]
