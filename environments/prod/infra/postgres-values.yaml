global:
  postgresql:
    auth:
      existingSecret: postgres-credentials   # SealedSecret committato
      secretKeys:
        adminPasswordKey: POSTGRES_PASSWORD

# Bitnami ha rimosso le immagini gratis da docker.io/bitnami/* nell'agosto 2025.
# Usiamo bitnamilegacy/* (frozen, gratis, niente security updates).
# Quando migreremo a un chart "vero prod" (es. CloudNativePG), questo override sparisce.
image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 17.0.0-debian-12-r0

architecture: standalone

primary:
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi

  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 2000m, memory: 1Gi }

  # Crea gli 8 database al primo boot. Porting di docker/init-databases.sh.
  initdb:
    scripts:
      00-create-databases.sql: |
        CREATE DATABASE burraco_identity;
        CREATE DATABASE burraco_player;
        CREATE DATABASE burraco_social;
        CREATE DATABASE burraco_lobby;
        CREATE DATABASE burraco_game;
        CREATE DATABASE burraco_ranking;
        CREATE DATABASE burraco_tournament;
        CREATE DATABASE burraco_notification;
