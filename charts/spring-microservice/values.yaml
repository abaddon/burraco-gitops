# Default values per il chart spring-microservice.
# Ogni servizio fornisce il suo values-{nome}.yaml in environments/prod/.

# Identità del servizio
name: ""                       # obbligatorio: identity-service, player-service, ecc.
namespace: burraco

image:
  repository: ""               # obbligatorio: ghcr.io/abaddon/ai-burraco/<service>
  tag: "main"                  # bumpato dalla CI
  pullPolicy: IfNotPresent

replicas: 1

# Rolling-update strategy. The prod cluster is a single node with ~0 spare
# capacity, so we roll old-pod-first (no surge) to avoid running 2x pods.
rollout:
  maxSurge: 0
  maxUnavailable: 1

service:
  port: 8080                   # porta interna del container Spring Boot

# Risorse — tight per stare nei 12 GB del VPS
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 640Mi

jvm:
  opts: "-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC"

# Variabili d'ambiente non-secret. I secret vengono iniettati via envFrom (vedi sotto).
env:
  SPRING_PROFILES_ACTIVE: prod

# Database (Postgres). Se serviceDb è impostato, viene generato lo SPRING_DATASOURCE_URL.
database:
  enabled: true
  serviceDb: ""                # es. burraco_identity

# Kafka/Redpanda
kafka:
  enabled: true
  bootstrapServers: redpanda.infra.svc.cluster.local:9092
  schemaRegistryUrl: http://redpanda.infra.svc.cluster.local:8081

# Redis (mini-chart custom in charts/redis/)
redis:
  enabled: true
  host: redis.infra.svc.cluster.local

# Secret references — i SealedSecret committati in environments/prod/secrets/
# vengono materializzati come Secret normali e referenziati qui via envFrom.
envFromSecrets:
  - postgres-credentials
  - redis-password
  - jwt-keys

# Ingress (Traefik IngressRoute CRD)
ingress:
  enabled: true
  host: burraco.qwertyha.co.uk
  pathPrefixes: []             # es. ["/api/v1/identity", "/api/v1/auth"]
  websocketPaths: []           # es. ["/ws/game"]
  tlsSecretName: burraco-tls

# Health checks (Spring Boot Actuator)
healthcheck:
  path: /actuator/health
  livenessInitialDelaySeconds: 60
  readinessInitialDelaySeconds: 30
  # Startup probe gates liveness/readiness until the JVM has finished booting
  # (Flyway + JPA cold start can exceed the liveness window, especially under
  # node CPU contention during a rolling update). 30 x 10s = up to 300s budget.
  startupPeriodSeconds: 10
  startupFailureThreshold: 30

# Prometheus scraping (Grafana Cloud via Alloy)
metrics:
  enabled: true
  path: /actuator/prometheus

# OpenTelemetry — tracing distribuito.
# Metriche e log sono già coperti da Grafana Alloy (Prometheus scrape + Loki),
# quindi qui esportiamo SOLO le tracce via OTLP per evitare doppio invio
# (e doppia fatturazione) verso Grafana Cloud.
#
# OTEL_EXPORTER_OTLP_ENDPOINT e OTEL_EXPORTER_OTLP_HEADERS NON stanno qui:
# sono operator-supplied e vivono nel SealedSecret `otel-otlp-credentials`
# (vedi environments/prod/secrets/README.md), referenziato come secretRef
# OPZIONALE — finché il secret non esiste i pod partono comunque, l'SDK
# OTel logga warning di export ma non va in crash.
otel:
  # 2026-05-29: Re-enabled. The `otel-otlp-credentials` SealedSecret was re-sealed
  # against the CURRENT in-cluster sealed-secrets controller key (the prior
  # artefact was sealed for a now-defunct key — see ADR-0002 / 2026-05-26) and
  # re-applied to namespace `burraco`, so OTEL_EXPORTER_OTLP_ENDPOINT +
  # OTEL_EXPORTER_OTLP_HEADERS now decrypt and inject via the optional secretRef.
  # Traces-only export (metrics/logs stay on Alloy) to Grafana Cloud Tempo.
  #
  # To disable again: flip this to false (chart injects OTEL_SDK_DISABLED=true).
  # See also: docs/adr/0002-disable-otel-default-in-spring-microservice-chart.md
  enabled: true
  # Esposto come resource attribute deployment.environment.
  environment: prod
  # Protocollo OTLP: http/protobuf è il più compatibile con i gateway gestiti.
  protocol: http/protobuf
  # Exporter per signal. metrics/logs = none perché già coperti da Alloy.
  tracesExporter: otlp
  metricsExporter: none
  logsExporter: none
  # Campionamento tracce — 10% in prod (VPS e tier Grafana Cloud risicati).
  tracesSampler: parentbased_traceidratio
  tracesSamplerArg: "0.1"
  # SealedSecret (namespace burraco) con OTEL_EXPORTER_OTLP_ENDPOINT e
  # OTEL_EXPORTER_OTLP_HEADERS. Lo creano/sealano gli operator.
  credentialsSecret: otel-otlp-credentials
