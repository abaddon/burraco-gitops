apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spring-microservice.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "spring-microservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Roll old-pod-first (no surge): the single-node prod cluster has no
      # spare capacity for a 2x-pods surge during updates. maxUnavailable:1
      # removes the old pod before the new one starts.
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "spring-microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spring-microservice.labels" . | nindent 8 }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        prometheus.io/port: {{ .Values.service.port | quote }}
        {{- end }}
    spec:
      containers:
        - name: app
          image: "{{ required "values.image.repository è obbligatorio" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.jvm.opts | quote }}
            {{- if .Values.database.enabled }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://burraco-rw.infra.svc.cluster.local:5432/{{ required "values.database.serviceDb è obbligatorio quando database.enabled=true" .Values.database.serviceDb }}"
            {{- end }}
            {{- if .Values.kafka.enabled }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ .Values.kafka.schemaRegistryUrl | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: SPRING_DATA_REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            # OpenTelemetry — vedi blocco `otel` in values.yaml.
            # Endpoint e header di auth arrivano dal secretRef opzionale sotto.
            - name: OTEL_SERVICE_NAME
              value: {{ include "spring-microservice.name" . | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Values.namespace }},deployment.environment={{ .Values.otel.environment }}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.otel.tracesExporter | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.otel.metricsExporter | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.otel.logsExporter | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.otel.tracesSampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.otel.tracesSamplerArg | quote }}
            {{- else }}
            # OTel disabled — silenzia esplicitamente la SDK del Java agent
            # baked-in (docker/Dockerfile.prebuilt). Senza questa env var
            # l'agent boota con endpoint default http://localhost:4318 e
            # spamma "Failed to export" ogni ~10s. Vedi ADR-0020.
            - name: OTEL_SDK_DISABLED
              value: "true"
            {{- end }}
          envFrom:
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            # Endpoint OTLP + header di auth, operator-supplied. Opzionale:
            # i pod partono anche se il secret non è ancora stato sealato.
            - secretRef:
                name: {{ .Values.otel.credentialsSecret }}
                optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: http
            periodSeconds: {{ .Values.healthcheck.startupPeriodSeconds }}
            failureThreshold: {{ .Values.healthcheck.startupFailureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.livenessInitialDelaySeconds }}
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.readinessInitialDelaySeconds }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
