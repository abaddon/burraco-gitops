# Default values for the node-service chart. Each service supplies its own
# values-<name>.yaml under environments/prod/.

# Service identity
name: ""                       # required: agent-stream-notifier, ...
namespace: burraco

image:
  repository: ""               # required: ghcr.io/abaddon/agent-stream-notifier
  tag: "main"                  # bumped by CI
  pullPolicy: IfNotPresent

replicas: 1

# Rolling-update strategy. The prod cluster is a single node with ~0 spare
# capacity, so roll old-pod-first (no surge) to avoid running 2x pods.
rollout:
  maxSurge: 0
  maxUnavailable: 1

service:
  port: 8787                   # container port

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Non-secret environment variables.
env: {}

# Secret references — SealedSecrets committed under environments/prod/secrets/
# are materialized as Secrets and injected here via envFrom.
envFromSecrets: []

healthcheck:
  path: /health
  livenessInitialDelaySeconds: 5
  readinessInitialDelaySeconds: 3
  # Startup probe gates liveness/readiness until the process is listening.
  startupPeriodSeconds: 5
  startupFailureThreshold: 12

# Ingress (Traefik IngressRoute CRD)
ingress:
  enabled: true
  host: burraco.qwertyha.co.uk
  pathPrefixes: []             # e.g. ["/events", "/health"]
  tlsSecretName: burraco-tls
