apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: infra
  # 2026-05-27 (ADR-0020): dropped argocd.argoproj.io/hook: PreSync so the Job
  # re-runs on every ArgoCD sync of the topic-init Application (~3 min cycle
  # with selfHeal=true) instead of only at first reconcile. Combined with
  # `argocd.argoproj.io/sync-options: Replace=true` below, this guarantees
  # the Job's pod is recreated each sync — the immutable Pod template would
  # otherwise block in-place updates and the Job would never re-run.
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app: kafka-topic-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: kafka-topic-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
          env:
            - name: BROKER
              value: "redpanda.infra.svc.cluster.local:9092"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "[topic-init] broker=${BROKER}"
              for entry in \
                "identity.events:3" \
                "player.events:3" \
                "social.friends:3" \
                "social.blocks:3" \
                "social.messages:3" \
                "lobby.rooms:3" \
                "lobby.match-requests:3" \
                "game.events:6" \
                "ranking.results:3" \
                "tournament.events:3" \
                "notification.requests:3"; do
                topic="${entry%%:*}"
                partitions="${entry##*:}"
                # rpk topic create with --if-not-exists exits 0 whether the
                # topic was newly created or already existed; we capture the
                # output so the operator can see which case applied per topic.
                out=$(rpk topic create "$topic" \
                  --partitions "$partitions" \
                  --replicas 1 \
                  --if-not-exists \
                  --brokers "$BROKER" 2>&1) || {
                  echo "[topic-init] ERROR $topic: $out"
                  exit 1
                }
                # rpk prints "TOPIC  STATUS\n<name>  OK" on create, or a
                # line containing "TOPIC_ALREADY_EXISTS" when --if-not-exists
                # short-circuits. Normalise to one line per topic.
                if echo "$out" | grep -q "TOPIC_ALREADY_EXISTS"; then
                  echo "[topic-init] already-exists $topic (partitions=$partitions)"
                else
                  echo "[topic-init] created $topic (partitions=$partitions)"
                fi
              done
              echo "[topic-init] --- final broker topic list ---"
              rpk topic list --brokers "$BROKER"
              echo "[topic-init] done"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
