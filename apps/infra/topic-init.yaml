apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: topic-init
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/abaddon/burraco-gitops
    targetRevision: main
    path: manifests/topic-init
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 2026-05-27 (ADR-0020): Replace=true forces ArgoCD to recreate the
      # kafka-topic-init Job (whose Pod template is immutable) on each sync
      # instead of failing the diff with a `Forbidden: field is immutable`
      # error. Combined with dropping the PreSync hook on the Job itself,
      # this makes topic provisioning self-heal on every ~3-min reconcile.
      - Replace=true
