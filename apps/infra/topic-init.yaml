apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: topic-init
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/abaddon/burraco-gitops
    targetRevision: main
    path: manifests/topic-init
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
