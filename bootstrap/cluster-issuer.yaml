apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: abaddon83@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # DNS-01 con Cloudflare: serve API token nel namespace cert-manager
      # con scope Zone:DNS:Edit sulla zone qwertyha.co.uk.
      # SealedSecret committato in environments/prod/secrets/cloudflare-api-token.sealed.yaml
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
